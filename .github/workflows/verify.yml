name: verify

# Runs on every push and every PR into dev/main. No secrets, no native binary:
# PLAN.md's three seams (GearSource, SimRunner, Store) all have recorded
# adapters, so the whole engine is designed to run offline from committed
# fixtures (see docs/verification-log.md). Green CI is the standing proof
# that path still works.
on:
  push:
  pull_request:
    branches: [dev, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # vendor/ is gitignored; skeleton:check needs the pinned APL (and
      # hardening soft-checks use db.json). Restore from data/wowsims.lock.json
      # without rewriting the lock.
      - run: pnpm run sync:wowsims:restore

      # vendor/atlasloot is gitignored too. Restoring it is what turns the two
      # atlasloot gates in `verify` from a skip into a real check: without the
      # Lua present they pass vacuously, and the committed parse
      # (data/faction_ids.json, which rep-tables:check depends on) would never
      # be compared against its source. Ticket 69.
      - run: pnpm run sync:atlasloot:restore

      # GH_TOKEN is for the upstream-drift:warn step at the tail of verify: it
      # shells out to `gh api`, which in Actions has no credentials unless one
      # is passed explicitly. Without it the drift check never ran here at all
      # -- run 32504123312 reported "CHECK DID NOT RUN", and before that fix it
      # reported "in sync with the pin" while checking nothing. Read-only; the
      # step is warn-only and cannot fail the build either way. Ticket 245.
      - run: pnpm run verify
        env:
          GH_TOKEN: ${{ github.token }}

      # PLAN.md §8.1: regenerating packages/core/src/proto/ from the pinned
      # data/proto/*.proto must reproduce the committed output exactly. A diff
      # here means either the generator drifted or someone hand-edited
      # generated code — both are bugs, not things to merge.
      - run: pnpm run proto:generate
      - run: git diff --exit-code -- packages/core/src/proto data/proto
